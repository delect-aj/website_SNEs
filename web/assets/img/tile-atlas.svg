  <circle cx="110" cy="66" r="58" stroke="#fff" stroke-opacity=".7" stroke-width="2"/>
  <!-- sugar chain -->
  <path d="M70 70 L78 60 L88 64 L96 54 L92 43 L100 34 M78 60 L74 48" stroke="#fff" stroke-width="2"/>
