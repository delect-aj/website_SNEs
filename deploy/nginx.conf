# Static site plus one proxied endpoint.
#
# The site is files on disk served by nginx. The only thing that needs a
# process is POST /map, and that process listens on localhost only, so nginx
# is the single public entry point.
#
# Install as /etc/nginx/sites-available/microbial-embeddings and symlink into
# sites-enabled. Replace SITE_ROOT and the server_name before use.

upstream map_service {
    server 127.0.0.1:8000;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name microbiome.example.org;

    # Everything except the ACME challenge goes to HTTPS once TLS is set up.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name microbiome.example.org;

    ssl_certificate     /etc/letsencrypt/live/microbiome.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/microbiome.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    root SITE_ROOT;
    index index.html;

    # ---------------------------------------------------------------- compression
    # The page weights that matter: otus.json is 16 MB raw and 0.9 MB gzipped,
    # the ONNX graph is 4.7 MB and does not compress. Brotli is better on all
    # of them if the module is available; gzip is the floor.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/wasm
        application/octet-stream;

    # ---------------------------------------------------------------- security
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    client_max_body_size 12m;   # /map caps uploads at 10 MB itself

    # ---------------------------------------------------------------- assets
    location /assets/ {
        # Filenames are not hashed, so bump this header or rename the file
        # when the JS changes, or visitors keep the old one for a month.
        add_header Cache-Control "public, max-age=2592000";
    }

    location /data/ {
        add_header Cache-Control "public, max-age=604800";
        # Everything here is fetched with fetch() and read as an array buffer,
        # so the MIME type does not matter except for the WebAssembly below.
        default_type application/octet-stream;
    }

    # The one file whose Content-Type is load-bearing. onnxruntime-web
    # instantiates it with the streaming API, which refuses anything that is
    # not application/wasm; a wrong type here is a dead dysbiosis page with no
    # useful error in the console. `types` blocks replace the whole inherited
    # map rather than extending it, so this is set per location instead.
    location ~* \.wasm$ {
        default_type application/wasm;
        add_header Cache-Control "public, max-age=2592000";
    }

    # The Embedding Projector runs on Google's domain and fetches these two
    # files cross-origin. Without CORS it shows an empty canvas and no error
    # worth reading.
    location /data/download/ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=604800";
    }

    # ---------------------------------------------------------------- the service
    location = /map {
        proxy_pass http://map_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";

        # vsearch is synchronous and the endpoint caps itself at 120 s.
        proxy_read_timeout 150s;
        proxy_send_timeout 150s;

        # Limit the damage one client can do to a single-core host.
        limit_req zone=map_limit burst=5 nodelay;
        limit_req_status 429;
    }

    location = /health {
        proxy_pass http://map_service;
        proxy_set_header Host $host;
        access_log off;
    }

    # ---------------------------------------------------------------- pages
    location / {
        try_files $uri $uri/ $uri/index.html =404;
        add_header Cache-Control "no-cache";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Long cache for anything with a hash or a date in its name, which the
    # binaries have by convention rather than by build step.
    location ~* \.(woff2?|png|svg|ico)$ {
        add_header Cache-Control "public, max-age=2592000";
    }
}

# The limiter needs an http-level zone; declare it once in nginx.conf's http
# block:
#
#   limit_req_zone $binary_remote_addr zone=map_limit:10m rate=10r/m;
