# Static site plus one proxied endpoint.
#
# The site is files on disk served by nginx. The only thing that needs a
# process is POST /map, and that process listens on localhost only, so nginx
# is the single public entry point.
#
# Install as /etc/nginx/sites-available/microbial-embeddings and symlink into
# sites-enabled. Replace SITE_ROOT and the server_name before use.

upstream map_service {
    server 127.0.0.1:8000;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name microbiome.example.org;

    # Everything except the ACME challenge goes to HTTPS once TLS is set up.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # `listen ... ssl http2` and not the newer `http2 on;`: that directive
    # needs nginx 1.25.1, and the distributions this is aimed at ship older
    # ones -- Ubuntu 22.04 has 1.18, 24.04 has 1.24, Debian 12 has 1.22, all
    # of which refuse to start on an unknown directive. nginx warns that this
    # form is deprecated from 1.25.1 on; it still works.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name microbiome.example.org;

    ssl_certificate     /etc/letsencrypt/live/microbiome.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/microbiome.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    root SITE_ROOT;
    index index.html;

    # ---------------------------------------------------------------- compression
    # The page weights that matter: otus.json is 16 MB raw and 0.9 MB gzipped,
    # the ONNX graph is 4.7 MB and does not compress. Brotli is better on all
    # of them if the module is available; gzip is the floor.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/wasm
        application/octet-stream;

    # ---------------------------------------------------------------- security
    # add_header is inherited only when the level below declares none of its
    # own, so any location that sets a header itself silently drops these
    # three. That is why every cache lifetime below is written as `expires`
    # rather than `add_header Cache-Control`, and why /data/download/, which
    # does need an add_header of its own for CORS, repeats them.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    client_max_body_size 12m;   # /map caps uploads at 10 MB itself

    # ---------------------------------------------------------------- assets
    location /assets/ {
        # Filenames are not hashed, so move this lifetime or rename the file
        # when the JS changes, or visitors keep the old one for a month.
        expires 30d;
    }

    location /data/ {
        expires 7d;
        # Everything here is fetched with fetch() and read as an array buffer,
        # so the MIME type does not matter except for the WebAssembly below.
        default_type application/octet-stream;
    }

    # The one file whose Content-Type is load-bearing. onnxruntime-web
    # instantiates it with the streaming API, which refuses anything that is
    # not application/wasm; a wrong type here is a dead dysbiosis page with no
    # useful error in the console. `types` blocks replace the whole inherited
    # map rather than extending it, so this is set per location instead.
    location ~* \.wasm$ {
        default_type application/wasm;
        expires 30d;
    }

    # The Embedding Projector runs on Google's domain and fetches these two
    # files cross-origin. Without CORS it shows an empty canvas and no error
    # worth reading.
    location /data/download/ {
        add_header Access-Control-Allow-Origin "*" always;
        # Repeated because this location declares an add_header of its own,
        # which stops the server-level ones being inherited.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        expires 7d;
    }

    # ---------------------------------------------------------------- the service
    location = /map {
        proxy_pass http://map_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwritten, not appended: /map rate-limits on the first address in
        # this header, and a client-supplied one would let it pick its own.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";

        # vsearch is synchronous and the endpoint caps itself at 120 s.
        proxy_read_timeout 150s;
        proxy_send_timeout 150s;

        # Limit the damage one client can do to a single-core host.
        limit_req zone=map_limit burst=5 nodelay;
        limit_req_status 429;
    }

    location = /health {
        proxy_pass http://map_service;
        proxy_set_header Host $host;
        access_log off;
    }

    # ---------------------------------------------------------------- pages
    location / {
        try_files $uri $uri/ $uri/index.html =404;
        expires -1;                 # Cache-Control: no-cache, revalidate
    }

    location = /index.html {
        expires -1;
    }

    # Long cache for anything with a hash or a date in its name, which the
    # binaries have by convention rather than by build step.
    location ~* \.(woff2?|png|svg|ico)$ {
        expires 30d;
    }
}

# The limiter needs an http-level zone; declare it once in nginx.conf's http
# block:
#
#   limit_req_zone $binary_remote_addr zone=map_limit:10m rate=10r/m;
